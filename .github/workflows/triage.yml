name: Triage Stage

# Reusable workflow. Consuming repos call this via `uses:` when an issue
# enters or re-enters the Triage stage. See examples/consuming-repo/claude.yml.

on:
  workflow_call:
    inputs:
      issue_number:
        type: number
        required: true
      model:
        type: string
        required: false
        default: claude-opus-4-7
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      CLAUDE_PIPELINE_PAT:
        required: true

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      id-token: write
    env:
      # Use the PAT (not GITHUB_TOKEN) so label edits we make to advance the
      # pipeline actually fire downstream workflow runs. Events from
      # GITHUB_TOKEN-driven API calls are deliberately suppressed by GitHub
      # to prevent recursion, which would break stage chaining entirely.
      GH_TOKEN: ${{ secrets.CLAUDE_PIPELINE_PAT }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ inputs.issue_number }}
    steps:
      - name: Checkout consuming repo
        uses: actions/checkout@v4

      - name: Checkout workflow template
        uses: actions/checkout@v4
        with:
          repository: jballaban/claude
          ref: main
          path: __workflow

      - name: Ensure pipeline labels exist
        working-directory: __workflow
        run: bash scripts/ensure-labels.sh config/labels.json

      - name: Normalize labels (consume claude:work-this on initial entry)
        env:
          # Override the job-level PAT with GITHUB_TOKEN for this step only.
          # We're setting stage:triage as state, not as a trigger — and the PAT
          # would re-fire this same workflow because the consuming repo listens
          # on `labeled stage:triage`. GITHUB_TOKEN-driven label events are
          # deliberately suppressed by GitHub, so this avoids the recursion.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | join(",")')
          if [[ ",$LABELS," == *",claude:work-this,"* ]]; then
            gh issue edit "$ISSUE" --remove-label "claude:work-this" --add-label "stage:triage"
            gh issue comment "$ISSUE" --body "🔍 Entering **Triage** stage."
          fi

      - name: Run Triage agent
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read and follow the system prompt at `__workflow/agents/triage/prompt.md` exactly.
            The issue to triage is #${{ inputs.issue_number }} in this repo.
            Post your analysis as a comment on that issue, then return your decision via structured output.
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools "Bash,Read,Glob,Grep,Write"
            --json-schema '{"type":"object","properties":{"decision":{"type":"string","enum":["READY","ASK","SPLIT"]},"summary":{"type":"string"}},"required":["decision"]}'

      - name: Compute cost summary
        id: cost
        working-directory: __workflow
        run: bash scripts/cost-summary.sh "${{ steps.agent.outputs.execution_file }}"

      - name: Route on decision
        env:
          # `|| '{}'` guards against the agent ending without emitting structured output —
          # without it, fromJSON('') errors at expression-eval time and blocks the step.
          DECISION: ${{ fromJSON(steps.agent.outputs.structured_output || '{}').decision || '' }}
          COST_BLOCK: ${{ steps.cost.outputs.block }}
        run: |
          set -euo pipefail
          NL=$'\n\n'
          case "$DECISION" in
            READY)
              gh issue edit "$ISSUE" --remove-label "stage:triage" --add-label "stage:plan"
              gh issue comment "$ISSUE" --body "✅ Triage complete → advancing to **Plan**.${NL}${COST_BLOCK}"
              ;;
            ASK)
              gh issue edit "$ISSUE" --add-label "claude:awaiting-approval"
              gh issue comment "$ISSUE" --body "⏸ Awaiting your answers above. Remove the \`claude:awaiting-approval\` label after you've answered, and Triage will re-run.${NL}${COST_BLOCK}"
              ;;
            SPLIT)
              gh issue edit "$ISSUE" --add-label "claude:awaiting-approval"
              gh issue comment "$ISSUE" --body "✂️ This issue is too large. File the proposed child issues, then remove \`claude:awaiting-approval\` to proceed.${NL}${COST_BLOCK}"
              ;;
            "")
              gh issue comment "$ISSUE" --body "⚠️ Triage agent finished without returning structured output. The comment above may show what was attempted, but the workflow cannot advance without a decision. Pipeline halted — re-trigger the stage manually to retry.${NL}${COST_BLOCK}"
              exit 1
              ;;
            *)
              gh issue comment "$ISSUE" --body "⚠️ Triage agent returned an unexpected decision: \`$DECISION\`. Pipeline halted.${NL}${COST_BLOCK}"
              exit 1
              ;;
          esac
