name: Deploy Review Stage

# Reusable workflow. Consuming repos call this when an issue enters the
# Deploy review stage (QA passed). See examples/consuming-repo/claude.yml.
#
# Despite the name, this stage does NOT deploy — it enumerates deploy-time
# concerns and verifies what can be verified pre-merge. Actual deployment
# happens after a human merges the PR.

on:
  workflow_call:
    inputs:
      issue_number:
        type: number
        required: true
      model:
        type: string
        required: false
        default: claude-opus-4-7
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  deploy-review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ inputs.issue_number }}
    steps:
      - name: Checkout consuming repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout workflow template
        uses: actions/checkout@v4
        with:
          repository: jballaban/claude
          ref: main
          path: __workflow

      - name: Ensure pipeline labels exist
        working-directory: __workflow
        run: bash scripts/ensure-labels.sh config/labels.json

      - name: Locate and check out working branch
        id: branch
        run: |
          set -euo pipefail
          BRANCH=$(git ls-remote --heads origin "claude/issue-${ISSUE}-*" \
            | awk '{print $2}' | sed 's|refs/heads/||' | head -1)
          if [[ -z "$BRANCH" ]]; then
            gh issue comment "$ISSUE" --body "⚠️ Deploy review could not find a working branch matching \`claude/issue-${ISSUE}-*\`. Pipeline halted."
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git fetch origin "$BRANCH:$BRANCH"
          git checkout "$BRANCH"

      - name: Announce entry
        run: gh issue comment "$ISSUE" --body "🚦 Entering **Deploy review** stage on branch \`${{ steps.branch.outputs.branch }}\`."

      - name: Run Deploy review agent
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read and follow the system prompt at `__workflow/agents/deploy-review/prompt.md` exactly.
            The issue is #${{ inputs.issue_number }} in this repo.
            You are already checked out on branch `${{ steps.branch.outputs.branch }}`.
            Enumerate deploy-time concerns, verify what you can, post a readiness comment, then return your decision via structured output.
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools "Bash,Read,Glob,Grep,Write"
            --json-schema '{"type":"object","properties":{"decision":{"type":"string","enum":["DONE","BOUNCE"]},"summary":{"type":"string"},"bounce_reason":{"type":"string"}},"required":["decision"]}'

      - name: Route on decision
        working-directory: __workflow
        env:
          DECISION: ${{ fromJSON(steps.agent.outputs.structured_output).decision }}
          BOUNCE_REASON: ${{ fromJSON(steps.agent.outputs.structured_output).bounce_reason }}
        run: |
          set -euo pipefail
          case "$DECISION" in
            DONE)
              gh issue edit "$ISSUE" --remove-label "stage:deploy-review" --add-label "stage:pr"
              gh issue comment "$ISSUE" --body "✅ Deploy review passed → advancing to **PR**."
              ;;
            BOUNCE)
              bash scripts/bounce.sh "deploy-review-dev" "stage:deploy-review" "stage:dev" "$BOUNCE_REASON"
              ;;
            *)
              gh issue comment "$ISSUE" --body "⚠️ Deploy review agent returned an unexpected decision: \`$DECISION\`. Pipeline halted."
              exit 1
              ;;
          esac
