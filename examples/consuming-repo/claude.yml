# Example consuming-repo workflow.
# Drop this into a downstream repo at .github/workflows/claude.yml.
#
# Requires:
#   - Repo secret CLAUDE_CODE_OAUTH_TOKEN (generate with `claude setup-token`)
#   - Repo secret CLAUDE_PIPELINE_PAT (fine-grained PAT with
#     Issues:write + Contents:write + Pull-requests:write). Required because
#     events triggered by the workflow's default GITHUB_TOKEN do not fire
#     downstream workflow runs, which would silently break stage chaining.
#
# Labels are created automatically by the first workflow run
# (see scripts/ensure-labels.sh in the template repo) — no manual setup needed.
# To start: apply the `claude:work-this` label to any issue.

name: Claude Pipeline

on:
  issues:
    types: [labeled, unlabeled]

jobs:
  triage:
    # Triage runs when:
    #   - claude:work-this is applied (initial enrollment); workflow consumes it
    #   - stage:triage is applied (Plan kicked back due to scope drift or rejection)
    #   - claude:awaiting-approval is removed while stage:triage is set (human answered)
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'claude:work-this') ||
      (github.event.action == 'labeled' && github.event.label.name == 'stage:triage') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'claude:awaiting-approval' &&
       contains(github.event.issue.labels.*.name, 'stage:triage'))
    # Required when the repo's default workflow-token permission is read-only.
    # Reusable workflows inherit the caller's permissions, so we must grant
    # issues:write here even though triage.yml also declares it.
    permissions:
      issues: write
      contents: read
      id-token: write
    uses: jballaban/claude/.github/workflows/triage.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_PIPELINE_PAT: ${{ secrets.CLAUDE_PIPELINE_PAT }}

  plan:
    # Plan runs when:
    #   - stage:plan is applied (Triage returned READY)
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'stage:plan'
    permissions:
      issues: write
      contents: read
      id-token: write
    uses: jballaban/claude/.github/workflows/plan.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_PIPELINE_PAT: ${{ secrets.CLAUDE_PIPELINE_PAT }}

  dev:
    # Dev runs when:
    #   - stage:dev is applied (Plan was approved, or QA bounced back)
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'stage:dev'
    permissions:
      issues: write
      contents: write
      id-token: write
    uses: jballaban/claude/.github/workflows/dev.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_PIPELINE_PAT: ${{ secrets.CLAUDE_PIPELINE_PAT }}

  qa:
    # QA runs when:
    #   - stage:qa is applied (Dev returned DONE)
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'stage:qa'
    permissions:
      issues: write
      contents: read
      id-token: write
    uses: jballaban/claude/.github/workflows/qa.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_PIPELINE_PAT: ${{ secrets.CLAUDE_PIPELINE_PAT }}

  deploy-review:
    # Deploy review runs when:
    #   - stage:deploy-review is applied (QA passed)
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'stage:deploy-review'
    permissions:
      issues: write
      contents: read
      id-token: write
    uses: jballaban/claude/.github/workflows/deploy-review.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_PIPELINE_PAT: ${{ secrets.CLAUDE_PIPELINE_PAT }}

  pr:
    # PR runs when:
    #   - stage:pr is applied (Deploy review passed)
    # This is the terminal automated stage. After it runs, a human owns the change.
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'stage:pr'
    permissions:
      issues: write
      contents: read
      pull-requests: write
      id-token: write
    uses: jballaban/claude/.github/workflows/pr.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_PIPELINE_PAT: ${{ secrets.CLAUDE_PIPELINE_PAT }}

  plan-decide:
    # Handles human verdict on a Plan-stage approval gate:
    #   - approval = claude:awaiting-approval removed → advance to stage:dev
    #   - rejection = claude:rejected applied → return to stage:triage
    if: >-
      contains(github.event.issue.labels.*.name, 'stage:plan') && (
        (github.event.action == 'unlabeled' && github.event.label.name == 'claude:awaiting-approval') ||
        (github.event.action == 'labeled' && github.event.label.name == 'claude:rejected')
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      # Use the PAT so the stage:dev / stage:triage label we apply here fires
      # the next stage's workflow. GITHUB_TOKEN-driven label events do not.
      GH_TOKEN: ${{ secrets.CLAUDE_PIPELINE_PAT }}
      # GH_REPO is required because this job doesn't check out the repo, so gh
      # has no local git remote to infer the target repo from.
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Route approval or rejection
        run: |
          set -euo pipefail
          if [[ "${{ github.event.action }}" == "unlabeled" ]]; then
            gh issue edit "$ISSUE" --remove-label "stage:plan" --add-label "stage:dev"
            gh issue comment "$ISSUE" --body "✅ Plan approved → advancing to **Development**."
          else
            # Reject: drop plan-stage labels in one patch so no event re-matches,
            # then add stage:triage in a second patch to fire Triage exactly once.
            gh issue edit "$ISSUE" --remove-label "claude:awaiting-approval" --remove-label "claude:rejected" --remove-label "stage:plan"
            gh issue edit "$ISSUE" --add-label "stage:triage"
            gh issue comment "$ISSUE" --body "↩️ Plan rejected → returning to **Triage**."
          fi
